[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-memo-agent"
version = "0.1.0"
description = "Memory-enhanced CFD agent prototype with an OpenFOAM execution backend."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18,<5", "python-dotenv>=1.0,<2"]

[project.scripts]
cfd-memo-agent = "cfd_memo_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfd_memo_agent = ["tutorial_capabilities.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
